name: .NET CI — BikeRental (Lab 1, Variant 70)

on:
  push:
    branches: ["lab_1", "lab_3", "lab_4", "main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: |
          dotnet restore BikeRental/BikeRental.Domain/BikeRental.Domain.csproj
          dotnet restore BikeRental/BikeRental.Tests/BikeRental.Tests.csproj

      - name: Build Domain project
        run: dotnet build BikeRental/BikeRental.Domain/BikeRental.Domain.csproj --no-restore --configuration Release

      - name: Build and run tests
        run: |
          dotnet build BikeRental/BikeRental.Tests/BikeRental.Tests.csproj --no-restore --configuration Release
          dotnet test BikeRental/BikeRental.Tests/BikeRental.Tests.csproj --no-build --configuration Release --verbosity normal
